name: carlosandre-portfolio-prod
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
x-app: &app
  image: carlosandre-portfolio-backend:${RELEASE_TAG:?Set RELEASE_TAG}
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  env_file: ${ENV_FILE:-.env.production}
  environment:
    DB_HOST: db
  networks: [private, egress]
  logging: *logging
  security_opt: [no-new-privileges:true]
  mem_limit: 384m
  cpus: 0.50
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 0.75
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  backend:
    <<: *app
    volumes: [media_data:/app/uploads]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: [python, -m, app.worker]
    volumes: [media_data:/app/uploads]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; assert time.time()-pathlib.Path('/tmp/worker-heartbeat').stat().st_mtime < 90"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
  frontend:
    image: carlosandre-portfolio-frontend:${RELEASE_TAG:?Set RELEASE_TAG}
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [private]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.75
  nginx:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private, egress]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    cpus: 0.25
networks:
  private: {internal: true}
  egress: {}
volumes:
  postgres_data: {}
  media_data: {}
