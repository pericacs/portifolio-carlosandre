limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { access_log off; return 200 'ok'; }
    location / { return 301 https://carlosandre.tech$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name carlosandre.tech;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    server_tokens off;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    if ($host != carlosandre.tech) { return 444; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/admin/ {
        limit_req zone=admin burst=30 nodelay;
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location / {
        set $web http://frontend:3000;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
