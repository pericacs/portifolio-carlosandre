# HTTP behind the existing VPS Nginx. Compose publishes only on loopback.
limit_req_zone $binary_remote_addr zone=portfolio_admin:10m rate=10r/s;
server {
    listen 80 default_server;
    server_name carlosandre.tech;
    server_tokens off;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /nginx-health { access_log off; return 200 'ok'; }
    # Keep file limit at 8 MiB in FastAPI, allowing only multipart overhead here.
    location = /api/admin/docx/preview {
        client_max_body_size 9m;
        error_page 413 = @portfolio_docx_too_large;
        limit_req zone=portfolio_admin burst=30 nodelay;
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location @portfolio_docx_too_large {
        default_type application/json;
        return 413 '{"detail":"O upload DOCX excedeu o limite de transporte. O arquivo deve ter ate 8 MB."}';
    }
    location /api/admin/ {
        limit_req zone=portfolio_admin burst=30 nodelay;
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location / {
        set $web http://frontend:3000;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
