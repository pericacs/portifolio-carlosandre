# Include INSIDE the HTTPS server block dedicated to carlosandre.tech only.
# 8 MiB DOCX + at most 1 MiB multipart envelope; never raise global limits.
location = /api/admin/docx/preview {
    client_max_body_size 9m;
    error_page 413 = @portfolio_docx_too_large;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host carlosandre.tech;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
location @portfolio_docx_too_large {
    default_type application/json;
    return 413 '{"detail":"O upload DOCX excedeu o limite de transporte. O arquivo deve ter ate 8 MB."}';
}
